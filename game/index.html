<head>

<title>Ember Archive — a firefly stealth heist</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0b0e14;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, "Times New Roman", serif;
  }
  #wrap {
    position: relative;
    width: 960px;
    height: 720px;
  }
  canvas {
    display: block;
    width: 960px;
    height: 720px;
    background: #141824;
    border: 2px solid #3a2f1d;
    border-radius: 6px;
    cursor: crosshair;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="720"></canvas>
</div>
<noscript><p style="color:#e8d9a8;text-align:center">Ember Archive needs JavaScript to play.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
